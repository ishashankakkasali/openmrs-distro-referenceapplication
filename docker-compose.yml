# All ${VAR:-default} placeholders below have sensible defaults — no .env
# file is required on the EC2 host. Override via shell env or a .env file
# if you want to change image tag (TAG) or DB creds (OMRS_DB_USER,
# OMRS_DB_PASSWORD, MYSQL_ROOT_PASSWORD).
#
# Volume names are pinned via `external: true name: o3_*` at the bottom,
# so the o3_db-data / o3_openmrs-data backup tar resolves on any host
# regardless of the compose project name.

services:
  gateway:
    image: openmrs/openmrs-reference-application-3-gateway:${TAG:-qa}
    restart: "unless-stopped"
    depends_on:
      - frontend
      - backend
    ports:
      - "9096:80"
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'

  frontend:
    image: openmrs/openmrs-reference-application-3-frontend:${TAG:-qa}
    restart: "unless-stopped"
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json
      SPA_DEFAULT_LOCALE:
    volumes:
      # EC2: /opt/openmrs/config-core_demo.json on the host
      # Local: symlink or copy your local frontend/config-core_demo.json to this path,
      #        or temporarily change back to ./frontend/config-core_demo.json for dev.
      - /opt/openmrs/config-core_demo.json:/usr/share/nginx/html/config-core_demo.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'

  backend:
    image: openmrs/openmrs-reference-application-3-backend:${TAG:-qa}
    restart: "unless-stopped"
    depends_on:
      - db
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1536m -XX:+UseG1GC -XX:MaxMetaspaceSize=256m"      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs"]
      timeout: 5s
    volumes:
      - openmrs-data:/openmrs/data
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.00'

  # MariaDB
  db:
    image: mariadb:10.11.7
    restart: "unless-stopped"
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
    healthcheck:
      test: "mysql --user=${OMRS_DB_USER:-openmrs} --password=${OMRS_DB_PASSWORD:-openmrs} --execute \"SHOW DATABASES;\""
      interval: 3s
      timeout: 1s
      retries: 5
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
    volumes:
      - db-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.50'

volumes:
  openmrs-data:
    external: true
    name: o3_openmrs-data
  db-data:
    external: true
    name: o3_db-data
