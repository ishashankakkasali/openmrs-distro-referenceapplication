# version: "3.7"

services:
  gateway:
    build:
      context: ./gateway

  frontend:
    build:
      context: ./frontend
    # Run our custom-ESM splice before the upstream startup.sh execs nginx.
    # The official image's CMD is `startup.sh` (not `nginx`), so the standard
    # /docker-entrypoint.d/ hook is never invoked — we wrap manually here.
    command: ["sh", "-c", "/docker-entrypoint.d/40-merge-custom-esms.sh; exec /usr/local/bin/startup.sh"]
    volumes:
      # Override the EC2 absolute path with a repo-relative one for local dev
      - ./frontend/config-core_demo.json:/usr/share/nginx/html/config-core_demo.json:ro
      # Custom ESMs spliced into importmap + routes registry at boot
      - ./frontend/custom-esms:/usr/share/nginx/html/custom-esms:ro
      - ./frontend/40-merge-custom-esms.sh:/docker-entrypoint.d/40-merge-custom-esms.sh:ro
      # Override nginx.conf to disable the 1y JS cache for /custom-esms/
      # (custom ESM bundles use stable filenames and would otherwise be
      # pinned forever in the browser after a hot rebuild).
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro

  backend:
    build:
      context: .
